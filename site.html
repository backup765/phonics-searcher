<style>
  .wrapper {
    font-family: sans-serif;
    max-width: 100%;
    margin: 0 auto;
    text-align: center;
  }

  .master-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .ctrl-btn {
    flex: 1;
    padding: 10px;
    cursor: pointer;
    background: #444;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: bold;
    text-transform: uppercase;
  }

  .main-container {
    display: flex;
    align-items: stretch;
    gap: 10px;
  }

  .row-sidebar {
    display: grid;
    grid-template-rows: repeat(7, 1fr);
    width: 77px; /* 30% thinner than 110px */
  }

  .row-btn-container {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .row-btn {
    width: 100%;
    height: 30px;
    background: #888;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 9px;
    font-weight: bold;
    transition: background 0.2s;
    white-space: nowrap;
    padding: 0 2px;
  }

  .row-btn:hover { background: #555; }

  .grid-wrapper {
    position: relative;
    flex-grow: 1;
    background-image: url('https://raw.githubusercontent.com/backup765/phonics-searcher/34c7d470d4e5779ae26d6c3e677290b595bceb2e/data/phonics_grid.jpg'); 
    background-size: 100% 100%;
    background-repeat: no-repeat;
    aspect-ratio: 900 / 630; 
  }

  #checkbox-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(7, 1fr);
    height: 100%;
    width: 100%;
  }

  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
    transition: all 0.1s ease;
    user-select: none;
    border: 0.5px solid rgba(0, 0, 0, 0.05);
  }

  .tile[data-state="0"] { background: rgba(255, 255, 255, 0.5); }
  .tile[data-state="1"] { background: rgba(76, 175, 80, 0.5); }
  .tile[data-state="2"] { background: rgba(255, 193, 7, 0.7); }

  /* Control bar containing centered search button and right-aligned dict selector */
  .action-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-top: 15px;
  }

  .action-btn {
    grid-column: 2;
    padding: 12px 40px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
  }

  .dict-container {
    grid-column: 3;
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dict-label {
    font-size: 0.75rem;
    font-weight: bold;
    color: #333;
    white-space: nowrap;
  }

  .dict-select {
    padding: 6px 10px;
    font-size: 0.75rem;
    font-weight: bold;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }

  #result-display {
    width: 100%;
    height: 150px;
    margin-top: 15px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.9rem;
    background: #fdfdfd;
    resize: vertical;
    overflow-y: scroll;
    box-sizing: border-box;
    display: block;
    text-align: left;
  }

  #result-count {
    margin-top: 8px;
    font-size: 0.85rem;
    font-weight: bold;
    color: #333;
    text-align: left;
  }
</style>

<div class="wrapper">
  <div class="master-controls">
    <button class="ctrl-btn" onclick="setAll(1)">Select All</button>
    <button class="ctrl-btn" onclick="setAll(0)">Unselect All</button>
  </div>

  <div class="main-container">
    <div class="row-sidebar" id="row-sidebar"></div>
    <div class="grid-wrapper">
      <div id="checkbox-grid"></div>
    </div>
  </div>

  <div class="action-bar">
    <button id="action-button" class="action-btn">Search</button>

    <div class="dict-container">
      <span class="dict-label">Dictionary In Use</span>
      <select id="dict-select" class="dict-select" onchange="selectedDictKey = this.value">
        <option value="clean-common" selected>Clean Common</option>
        <option value="common">Common</option>
        <option value="clean">Clean</option>
        <option value="full">Full</option>
      </select>
    </div>
  </div>

  <textarea id="result-display" placeholder="Results will appear here..." readonly></textarea>
  <div id="result-count"></div>
</div>

<script>
  let selectedDictKey = 'clean-common';
  const dictionaries = { 'clean-common': null, 'clean': null, 'common': null, 'full': null };

  const phonemes = [
    "S", "AE", "T", "IH", "P", "N",
    "K", "EH", "HH", "R", "M", "D",
    "G", "AA", "AH", "L", "F", "B",
    "EY", "JH", "OW", "AY", "IY", "AOR",
    "Z", "W", "NG", "V", "UH", "UW",
    "Y", "KS", "CH", "SH", "DH", "TH",
    "KW", "AW", "OY", "YUW", "ER", "AAR"
  ];

  const filePaths = {
    'clean-common': 'https://raw.githubusercontent.com/backup765/phonics-searcher/refs/heads/main/data/cmu_dict_clean_common.json',
    'clean': 'https://raw.githubusercontent.com/backup765/phonics-searcher/refs/heads/main/data/cmu_dict_clean.json',
    'common': 'https://raw.githubusercontent.com/backup765/phonics-searcher/refs/heads/main/data/cmu_dict_common.json',
    'full': 'https://raw.githubusercontent.com/backup765/phonics-searcher/refs/heads/main/data/cmu_dict_full.json'
  };

  async function loadDictionaries() {
    try {
      const loaders = Object.entries(filePaths).map(async ([key, url]) => {
        const response = await fetch(url);
        dictionaries[key] = await response.json();
      });
      await Promise.all(loaders);
    } catch (err) { console.error("Error loading dictionaries:", err); }
  }

  function toggleRow(rowIdx) {
    const firstTile = document.querySelector(`.tile[data-row="${rowIdx}"]`);
    const newState = firstTile.getAttribute('data-state') === "0" ? "1" : "0";
    
    document.querySelectorAll(`.tile[data-row="${rowIdx}"]`).forEach(t => {
      t.setAttribute('data-state', newState);
    });
  }

  function searchSubset(wordDict, selectedPhonemes, forcedPhonemes = []) {
    const targetSet = new Set(selectedPhonemes);
    const forcedSet = new Set(forcedPhonemes);
    const display = document.getElementById('result-display');
    const countDisplay = document.getElementById('result-count');

    let matches = Object.entries(wordDict).filter(([word, pron]) => {
        const wordPhonemes = pron.split(' ');
        const isSubset = wordPhonemes.every(p => targetSet.has(p));
        if (!isSubset) return false;

        if (forcedSet.size > 0) {
            const wordSet = new Set(wordPhonemes);
            return [...forcedSet].every(p => wordSet.has(p));
        }
        return true;
    }).map(([word, pron]) => word.replace(/\+/g, ''));

    const uniqueMatches = [...new Set(matches)];
    uniqueMatches.sort((a, b) => a.length - b.length || a.localeCompare(b));

    display.value = uniqueMatches.length > 0 ? uniqueMatches.join('\n') : "No matches found.";
    countDisplay.innerText = `Total results: ${uniqueMatches.length}`;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('checkbox-grid');
    const sidebar = document.getElementById('row-sidebar');
    const rows = 7;

    for (let r = 0; r < rows; r++) {
      const container = document.createElement('div');
      container.classList.add('row-btn-container');
      const btn = document.createElement('button');
      btn.classList.add('row-btn');
      btn.innerText = 'Select row ->';
      btn.onclick = function() { toggleRow(r); };
      container.appendChild(btn);
      sidebar.appendChild(container);
    }

    phonemes.forEach((ph, index) => {
      const tile = document.createElement('div');
      tile.classList.add('tile');
      tile.setAttribute('data-state', '0');
      tile.setAttribute('data-value', ph);
      tile.setAttribute('data-row', Math.floor(index / 6));
      tile.onclick = function() {
        this.setAttribute('data-state', (parseInt(this.getAttribute('data-state')) + 1) % 3);
      };
      grid.appendChild(tile);
    });

    document.getElementById('action-button').onclick = () => {
      if (!dictionaries[selectedDictKey]) return alert("Data is still loading...");

      let selected = [];
      let forced = [];

      document.querySelectorAll('.tile').forEach(tile => {
        const state = tile.getAttribute('data-state');
        const val = tile.getAttribute('data-value');
        if (state === "1" || state === "2") selected.push(val);
        if (state === "2") forced.push(val);
      });

      searchSubset(dictionaries[selectedDictKey], selected, forced);
    };

    loadDictionaries();
  });

  function setAll(state) {
    document.querySelectorAll('.tile').forEach(t => t.setAttribute('data-state', state));
  }
</script>
